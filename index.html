<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reelcall</title>
<meta name="description" content="AI sorts your Instagram saves into categories so you can actually find them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Gluten:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface2:#ECEFF2; --ink:#141C25; --muted:#66717F; --line:#DEE3E8;
  --brand:#0E6B66; --brand-ink:#FFFFFF; --ai:#E3A21F; --ai-soft:#FCF1DA; --danger:#B93A27; --none:#A9B3BF;
  --fd:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --fb:"Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1319; --surface:#171E27; --surface2:#1E2731; --ink:#E8EDF2; --muted:#8E9AA8; --line:#26313C;
    --brand:#3DB5AC; --brand-ink:#08201E; --ai:#F2B23A; --ai-soft:#3A2F17; --danger:#F07A63; --none:#4E5B68; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1319; --surface:#171E27; --surface2:#1E2731; --ink:#E8EDF2; --muted:#8E9AA8; --line:#26313C;
  --brand:#3DB5AC; --brand-ink:#08201E; --ai:#F2B23A; --ai-soft:#3A2F17; --danger:#F07A63; --none:#4E5B68; color-scheme: dark;
}
html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
*,*::before,*::after{ box-sizing: inherit; }
body{ margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 var(--fb); -webkit-font-smoothing:antialiased; }
button,input,select,textarea{ font:inherit; color:inherit; box-sizing:border-box; max-width:100%; }
a{ color:var(--brand); }
:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }
[hidden]{ display:none !important; }
.wrap{ max-width:960px; margin:0 auto; padding:0 16px 110px; }

/* header */
.top{ position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; background:var(--bg); padding:12px 0 10px; }
.titlebar{ display:flex; align-items:center; gap:8px; }
.brand{ font:800 24px/1 var(--fd); letter-spacing:-.02em; margin:0; display:flex; align-items:center; gap:9px; }
.logo{ width:30px; height:30px; flex:none; }
.grow{ flex:1; }
.count{ color:var(--muted); font-size:13.5px; margin:6px 0 12px; }
.btn{ border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:8px 12px; cursor:pointer; font-weight:600; font-size:14px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; text-decoration:none; color:var(--ink); }
.btn.primary{ background:var(--brand); color:var(--brand-ink); border-color:var(--brand); }
.btn.ai{ background:var(--ai); color:#241800; border-color:var(--ai); }
.btn.danger{ color:var(--danger); }
.btn.big{ padding:12px 16px; font-size:15px; border-radius:12px; }
.btn:disabled{ opacity:.5; cursor:default; }
.iconbtn{ border:0; background:transparent; padding:7px; border-radius:9px; cursor:pointer; color:var(--muted); display:inline-flex; }
.iconbtn:hover{ background:var(--surface2); color:var(--ink); }
.link{ border:0; background:none; padding:4px 2px; color:var(--muted); font-size:14px; font-weight:600; cursor:pointer; text-decoration:none; }
.link:hover{ color:var(--ink); }
.link.danger{ color:var(--danger); }
.tabs{ display:inline-grid; grid-template-columns:1fr 1fr 1fr; background:var(--surface2); border-radius:10px; padding:3px; gap:3px; }
.tabs button{ border:0; background:transparent; border-radius:8px; padding:6px 16px; font-weight:600; font-size:14px; cursor:pointer; color:var(--muted); }
.tabs button[aria-selected="true"]{ background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }
.chips{ display:flex; gap:6px; overflow-x:auto; margin-top:10px; padding-bottom:2px; scrollbar-width:none; }
.chips::-webkit-scrollbar{ display:none; }
.chip{ flex:none; border:0; background:var(--surface2); border-radius:999px; padding:5px 12px; cursor:pointer; font-size:13.5px; font-weight:500; display:inline-flex; align-items:center; gap:6px; }
.chip i{ width:8px; height:8px; border-radius:50%; background:var(--c, var(--none)); }
.chip[aria-pressed="true"]{ background:var(--ink); color:var(--bg); }
.tools{ display:flex; gap:8px; margin-top:10px; align-items:center; }
.search{ flex:1; border:0; background:var(--surface2); border-radius:10px; padding:9px 12px; min-width:0; }

/* category shelves */
.sec{ margin:14px 0 20px; }
.sechead{ display:flex; align-items:baseline; gap:8px; margin-bottom:8px; }
.sechead i{ width:10px; height:10px; border-radius:3px; flex:none; align-self:center; }
.sechead h3{ font:700 17px/1.2 var(--fd); margin:0; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sechead .n{ color:var(--muted); font-size:13.5px; flex:1; }
.shelf{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scroll-snap-type:x proximity; scrollbar-width:thin; }
.viewhead{ display:flex; align-items:center; gap:10px; margin:14px 0 10px; }
.viewhead h2{ font:700 19px/1.2 var(--fd); margin:0; flex:1; }

/* tiles (reel-shaped previews) */
.tile{ position:relative; flex:none; width:124px; aspect-ratio:3/4; border-radius:12px; overflow:hidden; color:#fff; background:hsl(var(--h) 30% 32%); scroll-snap-align:start; isolation:isolate; }
.grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(112px, 1fr)); gap:6px; }
.grid .tile{ width:auto; }
.tile img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.tile .emb{ position:absolute; left:0; top:-22px; width:326px; height:760px; border:0; transform:scale(.38); transform-origin:0 0; pointer-events:none; background:transparent; }
.grid .tile .emb{ transform:scale(.36); }
.tile .txt{ position:absolute; top:11px; left:10px; right:10px; margin:0; font-size:12.5px; line-height:1.32; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; overflow-wrap:anywhere; }
.grid .tile .txt{ -webkit-line-clamp:6; }
.tile.pic::after{ content:""; position:absolute; inset:45% 0 0; background:linear-gradient(transparent, rgba(0,0,0,.65)); pointer-events:none; }
.tile .who{ position:absolute; left:8px; right:30px; bottom:8px; z-index:1; font-size:11.5px; font-weight:600; white-space:nowrap; display:flex; align-items:center; gap:4px; }
.tile .who > span{ overflow:hidden; text-overflow:ellipsis; }
.tile .who i{ width:7px; height:7px; border-radius:50%; background:var(--c); flex:none; box-shadow:0 0 0 1.5px rgba(255,255,255,.7); }
.tile .who svg{ width:11px; height:11px; flex:none; }
.cover{ position:absolute; inset:0; z-index:2; border-radius:inherit; }
.tile .more{ position:absolute; right:2px; bottom:2px; z-index:3; border:0; background:transparent; color:#fff; padding:5px; border-radius:8px; cursor:pointer; display:flex; }
.tile .more svg{ width:16px; height:16px; filter:drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
.tile .more:hover{ background:rgba(255,255,255,.15); }
.tile.selecting{ cursor:pointer; }
.tile.sel{ outline:3px solid var(--brand); outline-offset:-3px; }
.tile .check{ position:absolute; top:7px; left:7px; z-index:2; width:22px; height:22px; border-radius:50%; border:2px solid #fff; display:grid; place-items:center; background:rgba(0,0,0,.25); }
.tile.sel .check{ background:var(--brand); border-color:var(--brand); color:var(--brand-ink); }
.more-btn{ margin:16px auto 0; display:block; }

/* empty + notices */
.empty{ padding:36px 0 20px; }
.empty h2{ font:800 clamp(32px, 7vw, 52px)/1.02 var(--fd); letter-spacing:-.03em; margin:0 0 14px; max-width:14ch; }
.steps{ list-style:none; padding:0; margin:0 0 24px; display:grid; gap:12px; max-width:62ch; counter-reset:s; color:var(--muted); }
.steps li{ counter-increment:s; display:grid; grid-template-columns:32px 1fr; gap:10px; align-items:start; }
.steps li::before{ content:counter(s); width:26px; height:26px; border-radius:50%; background:var(--ink); color:var(--bg); display:grid; place-items:center; font:700 13px/1 var(--fd); }
.drop{ border:2px dashed var(--line); border-radius:16px; padding:28px 20px; text-align:center; background:var(--surface); }
.drop.over{ border-color:var(--brand); }
.drop p{ margin:10px 0 0; color:var(--muted); font-size:13.5px; }
.notice{ display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:12px 0; font-size:14px; }
.blank{ text-align:center; padding:48px 10px; color:var(--muted); }
.toast{ position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); z-index:50; background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:12px; font-size:14px; max-width:min(92vw, 520px); box-shadow:0 6px 20px rgba(0,0,0,.2); cursor:pointer; }
.toast.err{ background:var(--danger); color:#fff; }

/* sheets */
.layer{ position:fixed; inset:0; z-index:20; display:flex; align-items:flex-end; justify-content:center; background:rgba(8,12,18,0); transition:background .2s; }
.layer.on{ background:rgba(8,12,18,.45); }
.sheet{ width:100%; max-width:540px; max-height:90%; overflow:auto; background:var(--surface); border-radius:20px 20px 0 0; padding:18px 18px calc(22px + env(safe-area-inset-bottom, 0px)); transform:translateY(24px); opacity:0; transition:transform .22s ease, opacity .22s ease; }
.layer.on .sheet{ transform:none; opacity:1; }
@media (min-width:720px){ .layer{ align-items:center; } .sheet{ border-radius:20px; padding-bottom:22px; } }
.sheet h3{ font:700 21px/1.15 var(--fd); margin:0; overflow-wrap:anywhere; }
.sheethead{ display:flex; align-items:flex-start; gap:12px; margin-bottom:14px; }
.sheethead > div{ flex:1; min-width:0; }
.sheet .sub{ color:var(--muted); font-size:14px; margin-top:3px; }
.av{ width:40px; height:40px; border-radius:12px; display:grid; place-items:center; font:700 17px/1 var(--fd); color:#fff; background:hsl(var(--h) 30% 38%); text-transform:uppercase; flex:none; }
.preview{ position:relative; width:100%; border-radius:14px; overflow:hidden; background:var(--surface2); margin-bottom:12px; }
.preview img{ display:block; width:100%; max-height:360px; object-fit:contain; }
.preview iframe{ display:block; width:100%; height:520px; border:0; }
.field{ margin-top:16px; }
.field > label, .field > .lbl{ display:block; font-weight:600; font-size:14px; margin-bottom:6px; }
.field .hint{ color:var(--muted); font-size:13px; margin-top:5px; }
select.input, input.input, textarea.input{ width:100%; border:1px solid var(--line); background:var(--surface2); border-radius:10px; padding:10px 12px; }
textarea.input{ min-height:64px; resize:vertical; }
.status{ margin-top:10px; font-size:13.5px; color:var(--muted); display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
details.more-info{ margin-top:12px; font-size:14px; }
details.more-info summary{ cursor:pointer; font-weight:600; color:var(--muted); }
details.more-info p{ white-space:pre-wrap; margin:8px 0 0; max-height:180px; overflow:auto; overflow-wrap:anywhere; }
.tags{ display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
.tags span{ font-size:12.5px; background:var(--surface2); border-radius:6px; padding:2px 7px; color:var(--muted); }
.watch{ width:100%; justify-content:center; }
.seg{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.seg label{ border:1px solid var(--line); border-radius:12px; padding:10px; cursor:pointer; background:var(--surface2); position:relative; }
.seg label b{ display:block; font:700 15px/1.2 var(--fd); }
.seg label span{ display:block; font-size:12.5px; color:var(--muted); margin-top:3px; line-height:1.35; }
.seg input{ position:absolute; opacity:0; pointer-events:none; }
.seg label:has(input:checked){ border-color:var(--ai); background:var(--ai-soft); }
.seg label:has(input:focus-visible){ outline:2px solid var(--brand); outline-offset:2px; }
@media (max-width:440px){ .seg{ grid-template-columns:1fr; } }
.tagbox{ display:flex; flex-wrap:wrap; gap:6px; border:1px solid var(--line); background:var(--surface2); border-radius:10px; padding:6px; }
.tag{ display:inline-flex; align-items:center; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:3px 4px 3px 10px; font-size:13.5px; }
.tag button{ border:0; background:transparent; cursor:pointer; color:var(--muted); padding:0 4px; font-size:16px; line-height:1; }
.tagbox input{ flex:1; min-width:120px; border:0; background:transparent; padding:4px 6px; outline:none; }
.radios{ display:flex; flex-direction:column; gap:6px; }
.radios{ display:flex; flex-direction:column; gap:8px; }
.radios label{ display:flex; gap:8px; align-items:center; font-size:14px; }
.two{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:440px){ .two{ grid-template-columns:1fr; } }
input[type=range]{ width:100%; accent-color:var(--ai); }
.runbox{ margin-top:14px; font-size:14px; padding:10px 12px; border-radius:10px; background:var(--ai-soft); }
.runbox.plain{ background:var(--surface2); }
.runbox.err{ background:color-mix(in srgb, var(--danger) 14%, var(--surface)); }
.prog{ height:6px; background:rgba(0,0,0,.08); border-radius:3px; overflow:hidden; margin-top:8px; }
.prog > i{ display:block; height:100%; background:var(--ai); width:0; transition:width .3s; }
.prog.indet > i{ width:30%; animation:slide 1.2s ease-in-out infinite; }
@keyframes slide{ from{ transform:translateX(-100%);} to{ transform:translateX(340%);} }
.actions{ display:flex; gap:8px; margin-top:20px; justify-content:flex-end; flex-wrap:wrap; }
.selbar{ position:fixed; left:0; right:0; bottom:0; z-index:10; background:var(--surface); border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.selbar .in{ max-width:960px; margin:0 auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.selbar .in b{ flex:1; white-space:nowrap; }
.selbar select{ width:auto; max-width:170px; }
.dialog{ position:fixed; inset:0; z-index:40; display:grid; place-items:center; background:rgba(8,12,18,.5); padding:20px; }
.dialog .box{ background:var(--surface); border-radius:16px; padding:18px; width:100%; max-width:420px; }
.dialog h4{ font:700 18px/1.2 var(--fd); margin:0 0 8px; }
.dialog p{ margin:0 0 12px; color:var(--muted); font-size:14px; }
.menu{ position:relative; }
.pop{ position:absolute; right:0; top:calc(100% + 6px); background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:6px; width:250px; z-index:8; box-shadow:0 8px 24px rgba(0,0,0,.14); max-height:72vh; overflow:auto; }
.pop button{ display:flex; gap:8px; align-items:center; width:100%; text-align:left; border:0; background:transparent; padding:9px 10px; border-radius:8px; cursor:pointer; font-size:14px; }
.pop button:hover{ background:var(--surface2); }
.pop button.danger{ color:var(--danger); }
.pop hr{ border:0; border-top:1px solid var(--line); margin:6px 4px; }
.pop .grp{ font-size:12.5px; color:var(--muted); padding:4px 10px 2px; }
.pop .sync{ font-size:12px; color:var(--muted); padding:6px 10px 4px; }
.pop button .ck{ width:16px; flex:none; color:var(--brand); }
.chat{ display:flex; flex-direction:column; gap:14px; padding:12px 0 80px; }
.msg{ font-size:14.5px; max-width:100%; }
.msg.me{ align-self:flex-end; background:var(--brand); color:var(--brand-ink); padding:9px 14px; border-radius:18px 18px 4px 18px; max-width:82%; overflow-wrap:anywhere; }
.msg.bot .say{ margin-bottom:8px; }
.msg.bot .say.pending{ color:var(--muted); animation:pulse 1.4s ease-in-out infinite; }
@keyframes pulse{ 50%{ opacity:.45; } }
.msg .acts{ display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
.msg .acts .btn{ font-size:13px; padding:6px 11px; border-radius:999px; }
.tile .more.add{ width:28px; height:28px; right:5px; bottom:5px; justify-content:center; align-items:center; background:var(--brand); color:var(--brand-ink); border-radius:50%; font-size:20px; font-weight:700; line-height:1; padding:0; }
.askbar{ position:fixed; left:0; right:0; bottom:0; z-index:10; background:var(--bg); border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.askbar .in{ max-width:960px; margin:0 auto; display:flex; gap:8px; }
.askbar input{ flex:1; min-width:0; border:0; background:var(--surface2); border-radius:999px; padding:11px 16px; }
.askbar .btn{ border-radius:999px; padding:10px 18px; }
.keystat{ margin-top:8px; font-size:14px; color:var(--muted); min-height:20px; }
.keystat.ok{ color:var(--brand); font-weight:600; }
.keystat.bad{ color:var(--danger); }
.keyline{ display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--surface2); border-radius:10px; padding:9px 12px; font-size:14px; margin-bottom:4px; overflow-wrap:anywhere; }
.loading{ padding:60px 0; text-align:center; color:var(--muted); }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

/* ================= Reelcall look: warm, playful, soft ================= */
:root{
  --bg:#F7F3FF; --surface:#FFFFFF; --surface2:#F0E9FF; --ink:#2B1F45; --muted:#7D7196; --line:#E7DFF8;
  --brand:#FF5A7A; --brand-ink:#FFFFFF; --violet:#8B5CFF; --ai:#FFC24B; --ai-soft:#FFF3D6; --danger:#E5484D; --none:#B9AED0;
  --grad:linear-gradient(135deg, #FF6B8B 0%, #A35BFF 100%);
  --fd:"Gluten", "Figtree", ui-rounded, system-ui, sans-serif;
  --fb:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --lift:0 10px 28px -12px rgba(76, 40, 140, .28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#140F24; --surface:#1F1836; --surface2:#2A2147; --ink:#F5F0FF; --muted:#A99DC6; --line:#342A55;
    --brand:#FF6F8E; --brand-ink:#FFFFFF; --violet:#A585FF; --ai:#FFC24B; --ai-soft:#3A2E1A; --danger:#FF7A7F; --none:#5B4F7A;
    --lift:0 12px 30px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#140F24; --surface:#1F1836; --surface2:#2A2147; --ink:#F5F0FF; --muted:#A99DC6; --line:#342A55;
  --brand:#FF6F8E; --brand-ink:#FFFFFF; --violet:#A585FF; --ai:#FFC24B; --ai-soft:#3A2E1A; --danger:#FF7A7F; --none:#5B4F7A;
  --lift:0 12px 30px -12px rgba(0,0,0,.6);
}
body{ font-size:15.5px; background:var(--bg); }
.brand{ font:700 27px/1 var(--fd); letter-spacing:0; gap:10px; }
.logo{ width:36px; height:36px; filter:drop-shadow(0 4px 10px rgba(163,91,255,.35)); }
.count{ font-size:14px; margin:8px 0 14px; }

.btn{ border:0; background:var(--surface2); border-radius:999px; padding:9px 16px; font-weight:700; transition:transform .12s ease; }
.btn:active{ transform:scale(.97); }
.btn.primary{ background:var(--brand); color:#fff; box-shadow:0 8px 18px -8px var(--brand); }
.btn.ai{ background:var(--grad); color:#fff; box-shadow:0 10px 22px -10px #A35BFF; }
.btn.danger{ background:transparent; color:var(--danger); }
.iconbtn{ border-radius:999px; }
.link{ color:var(--violet); font-weight:700; }
.link.danger{ color:var(--danger); }

.tabs{ background:var(--surface2); border-radius:999px; padding:4px; }
.tabs button{ border-radius:999px; padding:7px 18px; font-weight:700; }
.tabs button[aria-selected="true"]{ background:var(--surface); color:var(--ink); box-shadow:0 4px 12px -4px rgba(76,40,140,.25); }
.chip{ background:var(--surface); border-radius:999px; padding:6px 13px; font-weight:600; box-shadow:0 1px 0 var(--line); }
.chip i{ width:9px; height:9px; }
.chip[aria-pressed="true"]{ background:var(--ink); color:var(--bg); }
.search{ background:var(--surface); border-radius:999px; padding:10px 16px; box-shadow:inset 0 0 0 1px var(--line); }

.sec{ margin:16px 0 24px; }
.sechead{ align-items:center; margin-bottom:10px; }
.sechead i{ width:12px; height:12px; border-radius:50%; box-shadow:0 0 0 4px color-mix(in srgb, currentColor 0%, transparent); }
.sechead h3{ font:700 20px/1.2 var(--fd); }
.sechead .n{ flex:none; margin-right:auto; background:var(--surface2); color:var(--muted); border-radius:999px; padding:1px 9px; font-size:12.5px; font-weight:700; }
.shelf{ gap:10px; padding:2px 2px 12px; scrollbar-width:none; }
.shelf::-webkit-scrollbar{ display:none; }
.viewhead h2{ font:700 22px/1.2 var(--fd); }

.tile{ width:132px; border-radius:20px; color:#fff;
  background:linear-gradient(155deg, hsl(var(--h) 76% 62%) 0%, hsl(calc(var(--h) + 34) 70% 48%) 100%);
  box-shadow:0 10px 20px -12px hsl(var(--h) 60% 35% / .8); }
.grid{ grid-template-columns:repeat(auto-fill, minmax(112px, 1fr)); gap:10px; }
.tile .txt{ font-size:13px; font-weight:600; line-height:1.3; text-shadow:0 1px 2px rgba(0,0,0,.18); }
.tile .who{ font-weight:700; }
.tile .who i{ box-shadow:0 0 0 2px #fff; }
.tile.sel{ outline:3px solid var(--violet); }
.tile.sel .check{ background:var(--violet); border-color:var(--violet); }
.tile .more.add{ background:#fff; color:var(--violet); }

.empty{ padding:24px 0 20px; text-align:center; }
.empty h2{ font:700 clamp(34px, 9vw, 54px)/1.05 var(--fd); letter-spacing:0; margin:6px auto 18px; max-width:12ch; }
.empty .steps{ text-align:left; margin:0 auto 24px; }
.steps li::before{ background:var(--grad); color:#fff; }
.drop{ border:2px dashed color-mix(in srgb, var(--violet) 45%, transparent); border-radius:24px; background:var(--surface); }
.fan{ position:relative; height:150px; margin:8px auto 4px; width:220px; }
.fan span{ position:absolute; left:50%; top:10px; width:86px; height:118px; border-radius:18px; margin-left:-43px;
  background:linear-gradient(155deg, hsl(var(--h) 80% 68%), hsl(calc(var(--h) + 38) 72% 52%)); box-shadow:var(--lift); }
.fan span:nth-child(1){ transform:translateX(-58px) rotate(-12deg); }
.fan span:nth-child(2){ transform:translateY(-8px); z-index:1; }
.fan span:nth-child(3){ transform:translateX(58px) rotate(12deg); }
.fan span::after{ content:""; position:absolute; left:50%; top:50%; margin:-12px 0 0 -8px; border-left:20px solid rgba(255,255,255,.95); border-top:12px solid transparent; border-bottom:12px solid transparent; }
@media (prefers-reduced-motion: no-preference){
  .fan span:nth-child(1){ animation:fanL .7s cubic-bezier(.2,.9,.3,1.3) both; }
  .fan span:nth-child(3){ animation:fanR .7s cubic-bezier(.2,.9,.3,1.3) both; }
  @keyframes fanL{ from{ transform:translateX(0) rotate(0); } }
  @keyframes fanR{ from{ transform:translateX(0) rotate(0); } }
}

.notice{ border:0; border-radius:20px; background:var(--surface); box-shadow:var(--lift); padding:14px 16px; }
.toast{ border-radius:999px; background:var(--ink); color:var(--bg); padding:11px 18px; font-weight:600; }
.toast.err{ background:var(--danger); }

.layer.on{ background:rgba(20,12,40,.45); backdrop-filter:blur(3px); }
.sheet{ border-radius:28px 28px 0 0; padding-top:12px; }
.sheet::before{ content:""; display:block; width:42px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 14px; }
@media (min-width:720px){ .sheet{ border-radius:28px; } }
.sheet h3{ font:700 23px/1.15 var(--fd); }
.av{ border-radius:14px; background:linear-gradient(155deg, hsl(var(--h) 78% 64%), hsl(calc(var(--h) + 38) 72% 50%)); }
select.input, input.input, textarea.input{ border-radius:14px; background:var(--surface2); border:1px solid transparent; }
select.input:focus, input.input:focus, textarea.input:focus{ outline:none; border-color:var(--violet); background:var(--surface); }
.seg label{ border-radius:18px; border:2px solid transparent; background:var(--surface2); }
.seg label b{ font:700 16px/1.2 var(--fd); }
.seg label:has(input:checked){ border-color:var(--violet); background:color-mix(in srgb, var(--violet) 12%, var(--surface)); }
input[type=range]{ accent-color:var(--violet); }
.keyline, .runbox{ border-radius:16px; }
.prog > i{ background:var(--grad); }
.keystat.ok{ color:var(--violet); }
.preview{ border-radius:20px; }
.tags span{ border-radius:999px; padding:2px 9px; }

.msg.me{ background:var(--grad); color:#fff; border-radius:20px 20px 6px 20px; }
.msg .acts .btn{ background:var(--surface); box-shadow:inset 0 0 0 1px var(--line); }
.askbar{ background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-top:0; }
.askbar input{ background:var(--surface); box-shadow:inset 0 0 0 1px var(--line); }
.askbar .btn{ background:var(--grad); color:#fff; }
.selbar{ border-radius:22px 22px 0 0; border-top:0; box-shadow:0 -10px 30px -12px rgba(76,40,140,.3); }
.pop{ border:0; border-radius:20px; box-shadow:var(--lift), 0 0 0 1px var(--line); }
.pop button{ border-radius:12px; font-weight:600; }
.dialog .box{ border-radius:24px; }
.dialog h4{ font:700 20px/1.2 var(--fd); }
</style>
</head>

      select: () => { state.selecting = !state.selecting; state.selected.clear(); render(); },
      rename: () => c && renameCategory(c), delcat: () => c && deleteCategory(c) };
    if (fns[a]){ fns[a](); return; }
  }
  const tile = e.target.closest(".tile.selecting");
  if (tile){ const k = tile.dataset.k; state.selected.has(k) ? state.selected.delete(k) : state.selected.add(k); tile.outerHTML = tileHtml(state.posts.find(p => p.k === k)); renderSelbar(); }
});
document.addEventListener("dragover", e => { if (state.posts.length) e.preventDefault(); });
document.addEventListener("drop", e => { if (state.posts.length && e.dataTransfer && e.dataTransfer.files.length){ e.preventDefault(); importFiles([...e.dataTransfer.files]); } });

/* ---------- boot ---------- */
(async function init(){
  render();
  store = await pickStore();
  try {
    const libs = await store.get("libs");
    if (libs){
      state.libs = libs.list || [];
      const cur = state.libs.find(l => l.id === libs.current) || state.libs[0];
      if (cur) await loadLib(cur);
    } else {
      const legacy = await store.get("meta");  // migrate data from the first version
      if (legacy){
        const posts = [];
        for (let i = 0; i < (legacy.chunkCount || 0); i++){ const c = await store.get("chunk_" + i); if (c) posts.push(...(c.posts || [])); }
        state.libs = [{ id: "main", name: "My saves", created: nowS() }]; state.lib = state.libs[0]; resetLibState();
        state.posts = posts; state.cats = legacy.cats || []; state.settings = Object.assign(defaults(), legacy.settings || {}); state.colImported = !!legacy.colImported;
        dirty.all = true; dirty.meta = true; await flush(); await saveLibs();
        if (syncState !== "error"){ await store.del("meta"); for (let i = 0; i < (legacy.chunkCount || 0); i++) await store.del("chunk_" + i); }
      }
    }
    if (syncState !== "error") setSync("saved");
  } catch { setSync("error"); }
  if (EMBEDDED && OWNKEY && (EMBEDDED.savedAt || 0) > (state.savedAt || 0)){
    await openLibrary(EMBEDDED, true);
    toast("Opened your library from this file");
  }
  if (OWNKEY && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  // When hosted (e.g. GitHub Pages), make Reelcall installable: Chrome turns it into a real app on the phone.
  if (OWNKEY && !NATIVE && /^https:/.test(location.href)){
    const link = document.createElement("link"); link.rel = "manifest"; link.href = "manifest.json"; document.head.append(link);
    const meta = document.createElement("meta"); meta.name = "theme-color"; meta.content = "#F7F3FF"; document.head.append(meta);
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  state.loaded = true;
  render();
  getSample().then(s => { aiAvailable = !!s; render(); });
  if (/^#ig=/.test(location.hash)){
    let found = [];
    try { found = parseExport(JSON.parse(decodeURIComponent(location.hash.slice(4)))); } catch { toast("Couldn't read the saves from Instagram. Try the bookmark again.", true); }
    history.replaceState(null, "", location.pathname + location.search);
    if (found.length) setTimeout(() => importFromInstagram(found), 300);
  }
  if (NATIVE){
    const ig = igState();
    if (ig.pending) setTimeout(() => syncInstagram(false), 1200);                                   // back from logging in
    else if (ig.on && ig.auto && nowS() - ig.last > 2 * 3600) setTimeout(() => syncInstagram(true), 1500);  // quiet check on open
  }
  if (NATIVE) document.addEventListener("click", e => { const a = e.target.closest('a[target="_blank"]'); if (a){ e.preventDefault(); e.stopPropagation(); openExternal(a.href); } }, true);
  if (window.claude && typeof window.claude.use === "function"){
    window.claude.use("downloads").then(d => { downloadsNS = d; render(); }).catch(() => {});
    window.claude.use("assets").then(a => { assetsNS = a; }).catch(() => {});
  }
})();
})();
</script>
</body>
</html>
